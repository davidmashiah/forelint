[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "forelint"
version = "0.2.0"
description = "Lint your forecast backtests: leakage between related series, the run-to-run noise floor, model comparison tests, and per-item bias before you trust a score."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Mashiah" }]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
]
keywords = [
  "forecasting", "forecast evaluation", "time series cross-validation", "backtesting",
  "data leakage", "group k-fold", "diebold-mariano", "model confidence set",
  "tracking signal", "forecast bias", "forecast value added", "demand forecasting",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7", "arch>=6"]

[project.urls]
Homepage = "https://github.com/davidmashiah/forelint"
Source = "https://github.com/davidmashiah/forelint"
Author = "https://davidmashiah.com/"

[tool.hatch.build.targets.wheel]
packages = ["src/forelint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
